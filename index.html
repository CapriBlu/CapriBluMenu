<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capri Blu Sorrento</title>

  <link rel="icon" type="image/png" href="./img/Logo-Capri-Blu-Def.png">
  <link rel="stylesheet" href="./style.css?v=72">
</head>

<body>

  <video class="bg-video bg-video-desktop" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="./img/Video.Sito.capri.Blu_compressed.mp4" type="video/mp4">
  </video>

  <video class="bg-video bg-video-mobile" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="./img/vid.webM.mobile.webm" type="video/webm">
    <source src="./img/Video.Sito.capri.Blu_compressed.mp4" type="video/mp4">
  </video>

  <div class="video-overlay" aria-hidden="true"></div>

  <div class="page-shell">

    <header class="top-brand" aria-label="Capri Blu Sorrento">
      <img src="./img/pasta-lovers1.png" class="top-pasta top-pasta-left" alt="Pasta Lovers">

      <a
        class="brand-logo-link"
        href="https://www.instagram.com/capri_blu_sorrento?igsh=OXZmdnk3YjYydGEx"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="brand-logo"
          src="./img/LOGO.capriblu.png?v=1"
          alt="Capri Blu Trattoria Pizzeria Napoletana"
        >
      </a>

      <img src="./img/pasta-lovers1.png" class="top-pasta top-pasta-right" alt="Pasta Lovers">
    </header>

    <main class="card">

      <p class="subtitle">
        Your menu download is ready
      </p>

      <div class="buttons">

        <a class="image-button food-button" href="./pdf/menu-it-eng.pdf" download>
          <img src="./img/bottone-food.png" alt="Food Menu">
        </a>

        <a class="image-button drink-button" href="./pdf/drink-menu.pdf" download>
          <img src="./img/drink.menu2.png?v=1" alt="Drink Menu">
        </a>

        <a class="image-button gallery-button" href="./galleria.html">
          <img src="./img/bottone-foto.png" alt="Foto Gallery">
        </a>

        <div class="quick-buttons" aria-label="Quick actions">
          <a
            class="image-button quick-button thefork-button"
            href="https://www.thefork.it/ristorante/capri-blu-sorrento-r861548"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./img/Gem.Bott.fork.png?v=1" alt="Book with TheFork">
          </a>

          <a
            class="image-button quick-button google-button"
            href="https://www.google.com/search?q=capri+blu+sorrento"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./img/gem.bott.google.png?v=1" alt="Leave a Review on Google">
          </a>
        </div>

      </div>

    </main>

  </div>

</body>
</html>
