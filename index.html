<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capri Blu Sorrento</title>

  <link rel="icon" type="image/png" href="./img/Logo-Capri-Blu-Def.png">
  <link rel="stylesheet" href="./style.css?v=78">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300&amp;display=swap">
  <link rel="stylesheet" href="./brand-slider.css?v=3">
  <script src="./script/brand-slider.js?v=2" defer></script>
  <link rel="stylesheet" href="./home-entry.css?v=1">
  <script src="./script/home-entry.js?v=1" defer></script>
</head>
<body>
  <video class="bg-video bg-video-desktop" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="./img/capri_blu_pc_25s_1080p_hq.mp4?v=1" type="video/mp4">
  </video>

  <video class="bg-video bg-video-mobile" autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="./img/vid.webM.mobile.webm" type="video/webm">
    <source src="./img/capri_blu_pc_25s_1080p_hq.mp4?v=1" type="video/mp4">
  </video>

  <div class="video-overlay" aria-hidden="true"></div>

  <div class="page-shell">
    <div class="home-language">
      <label id="home-language-label" for="home-language">Lingua</label>
      <select id="home-language"><option value="it">Italiano</option><option value="en">English</option></select>
    </div>
    <header class="top-brand" aria-label="Capri Blu Sorrento">
      <img
        class="top-pasta top-pasta-left"
        src="./img/pasta-lovers1.png"
        alt="Pasta Lovers"
      >

      <a
        class="brand-logo-link"
        href="https://www.instagram.com/capri_blu_sorrento?igsh=OXZmdnk3YjYydGEx"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="brand-logo"
          src="./img/LOGO.capriblu.png?v=1"
          alt="Capri Blu Trattoria Pizzeria Napoletana"
        >
      </a>

      <img
        class="top-pasta top-pasta-right"
        src="./img/pizza.lovers.png?v=2026070502"
        alt="Pizza Lovers"
      >
    </header>

    <section class="brand-slider" tabindex="0" lang="it" aria-label="L'anima di Capri Blu">
      <ul class="brand-slider-description">
        <li>Sorrento</li>
        <li>Pizzeria &amp; Trattoria Napoletana</li>
        <li>Sapori Autentici</li>
        <li>Cucina Mediterranea</li>
        <li>Un Agrumeto Tutto l'Anno</li>
      </ul>
      <div class="brand-slider-viewport" aria-hidden="true">
        <span class="brand-slider-phrase is-active">Sorrento</span>
        <span class="brand-slider-phrase">Pizzeria &amp; Trattoria Napoletana</span>
        <span class="brand-slider-phrase">Sapori Autentici</span>
        <span class="brand-slider-phrase">Cucina Mediterranea</span>
        <span class="brand-slider-phrase">Un Agrumeto Tutto l'Anno</span>
      </div>
    </section>

    <main class="card home-entry">

      <div class="buttons">
        <a class="discover-menu-button" id="discover-menu" href="./menu/?lang=it&amp;v=home-entry-1"><span id="discover-menu-label">Scopri il nostro menu</span><span aria-hidden="true">→</span></a>

<div class="quick-buttons" aria-label="Quick actions">
          <a
            class="image-button quick-button thefork-button"
            href="https://www.thefork.it/ristorante/capri-blu-sorrento-r861548"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./img/Gem.Bott.fork.png?v=1" alt="Book with TheFork">
          </a>

          <a
            class="image-button quick-button google-button"
            href="https://www.google.com/search?q=capri+blu+sorrento"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./img/gem.bott.google.png?v=1" alt="Leave a Review on Google">
          </a>
        </div>
      </div>
    </main>
  </div>

</html>
